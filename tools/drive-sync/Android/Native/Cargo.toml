[package]
name = "afdrive"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
libc = "0.2"
rocksdb = { version = "0.22", default-features = false, features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "=1.16.0", features = ["v4", "serde"] }
yrs = "=0.21.3"

[profile.release]
debug = 0
strip = "debuginfo"
opt-level = 1

[profile.dev]
debug = 0
