buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
// Plugins ship with many older buildscript tool versions. Keep this isolated
// experiment on one compatible set instead of instrumenting every version.
subprojects {
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' && details.requested.name == 'gradle') {
                details.useVersion '8.5.2'
            }
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name == 'kotlin-gradle-plugin') {
                details.useVersion '1.9.24'
            }
        }
    }
    plugins.withId('com.android.library') {
        def manifest = file('src/main/AndroidManifest.xml')
        def originalNamespace = manifest.exists() ? new XmlSlurper().parse(manifest).@package.text() : ''
        if (originalNamespace) android.namespace = originalNamespace
        androidComponents.finalizeDsl { extension ->
            extension.compileSdk = 35
            extension.buildToolsVersion = '35.0.0'
            extension.ndkVersion = '24.0.8215888'
        }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
